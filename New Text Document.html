<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Couple</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #fff0f6 0%, #ffe3ef 35%, #ffd9ec 65%, #dff4ff 100%);
      font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 900px;
      max-width: 100%;
      height: 560px;
      text-align: center;
    }

    .title {
      margin-top: 20px;
      font-size: 42px;
      font-weight: bold;
      color: #ff4f93;
      text-shadow: 0 2px 0 #fff, 0 6px 14px rgba(255, 105, 180, 0.25);
      letter-spacing: 1px;
      padding: 0 20px;
    }

    .sky-heart {
      position: absolute;
      color: #ff82b2;
      font-size: 24px;
      animation: float 3s ease-in-out infinite;
      opacity: 0.9;
    }

    .sky-heart.h1 { top: 90px; left: 140px; }
    .sky-heart.h2 { top: 130px; right: 160px; animation-delay: .8s; }
    .sky-heart.h3 { top: 180px; left: 230px; animation-delay: 1.4s; }
    .sky-heart.h4 { top: 150px; right: 260px; animation-delay: 2s; }

    .moon {
      position: absolute;
      top: 70px;
      right: 90px;
      width: 72px;
      height: 72px;
      background: #fff4b8;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(255, 240, 180, 0.8);
    }

    .moon::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 18px;
      width: 62px;
      height: 62px;
      background: #ffe8f2;
      border-radius: 50%;
    }

    .ground {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 110%;
      height: 180px;
      background: linear-gradient(to top, #bde7c7, #dff7e5);
      border-top-left-radius: 50% 70px;
      border-top-right-radius: 50% 70px;
    }

    .couple {
      position: absolute;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      width: 380px;
      height: 290px;
    }

    .person {
      position: absolute;
      bottom: 0;
      width: 170px;
      height: 270px;
    }

    .girl { left: 20px; }
    .boy { right: 20px; }

    .head {
      position: absolute;
      top: 18px;
      left: 48px;
      width: 72px;
      height: 72px;
      background: #ffd8bf;
      border: 4px solid #333;
      border-radius: 50%;
      z-index: 3;
    }

    .girl .hair-back {
      position: absolute;
      top: 8px;
      left: 35px;
      width: 98px;
      height: 118px;
      background: #6a3d2d;
      border: 4px solid #333;
      border-radius: 48px 48px 38px 38px;
      z-index: 1;
    }

    .girl .hair-shine {
      position: absolute;
      top: 26px;
      left: 55px;
      width: 24px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      z-index: 2;
      transform: rotate(-18deg);
    }

    .boy .hair {
      position: absolute;
      top: 8px;
      left: 42px;
      width: 84px;
      height: 44px;
      background: #3c2a21;
      border: 4px solid #333;
      border-radius: 42px 42px 18px 18px;
      z-index: 4;
    }

    .boy .head::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 8px;
      width: 50px;
      height: 22px;
      background: #3c2a21;
      border-radius: 20px 20px 6px 6px;
    }

    .neck {
      position: absolute;
      top: 84px;
      left: 72px;
      width: 24px;
      height: 18px;
      background: #ffd8bf;
      border-left: 4px solid #333;
      border-right: 4px solid #333;
      z-index: 1;
    }

    .torso {
      position: absolute;
      top: 98px;
      left: 36px;
      width: 98px;
      height: 86px;
      border: 4px solid #333;
      border-radius: 26px;
      z-index: 1;
    }

    .girl .torso {
      background: linear-gradient(to bottom, #ff9fc4, #ff74a7);
    }

    .boy .torso {
      background: linear-gradient(to bottom, #8ed0ff, #67b7f7);
    }

    .girl .skirt {
      position: absolute;
      top: 172px;
      left: 26px;
      width: 118px;
      height: 58px;
      background: linear-gradient(to bottom, #ff8fba, #ff5d99);
      border: 4px solid #333;
      clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
      z-index: 1;
    }

    .boy .shorts {
      position: absolute;
      top: 178px;
      left: 44px;
      width: 84px;
      height: 44px;
      background: #5fa8e8;
      border: 4px solid #333;
      border-radius: 0 0 18px 18px;
      z-index: 1;
    }

    .arm {
      position: absolute;
      top: 112px;
      height: 16px;
      border: 4px solid #333;
      border-radius: 14px;
      z-index: 5;
    }

    .girl .arm.outer {
      left: -4px;
      width: 58px;
      transform: rotate(20deg);
      background: #ff8fba;
    }

    .girl .arm.inner {
      left: 102px;
      width: 52px;
      transform: rotate(10deg);
      background: #ff8fba;
    }

    .boy .arm.outer {
      right: -4px;
      width: 58px;
      transform: rotate(-20deg);
      background: #7ec7fb;
    }

    .boy .arm.inner {
      left: -4px;
      width: 52px;
      transform: rotate(-10deg);
      background: #7ec7fb;
    }

    .joined-hands {
      position: absolute;
      top: 127px;
      left: 164px;
      width: 52px;
      height: 24px;
      z-index: 10;
    }

    .joined-hands::before,
    .joined-hands::after {
      content: "";
      position: absolute;
      top: 2px;
      width: 18px;
      height: 18px;
      background: #ffd8bf;
      border: 3px solid #333;
      border-radius: 50%;
    }

    .joined-hands::before {
      left: 8px;
    }

    .joined-hands::after {
      right: 8px;
    }

    .leg {
      position: absolute;
      top: 218px;
      width: 16px;
      height: 54px;
      background: #ffd8bf;
      border: 4px solid #333;
      border-radius: 12px;
      z-index: 0;
    }

    .girl .leg.left { left: 56px; }
    .girl .leg.right { left: 90px; }
    .boy .leg.left { left: 56px; }
    .boy .leg.right { left: 90px; }

    .shoe {
      position: absolute;
      top: 262px;
      width: 32px;
      height: 14px;
      background: #333;
      border-radius: 12px;
      z-index: 0;
    }

    .girl .shoe.left { left: 48px; }
    .girl .shoe.right { left: 84px; }
    .boy .shoe.left { left: 48px; }
    .boy .shoe.right { left: 84px; }

    .blush-heart {
      position: absolute;
      bottom: 175px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      color: #ff6aa8;
      animation: pulse 2s ease-in-out infinite;
      z-index: 12;
    }

    .flower {
      position: absolute;
      bottom: 55px;
      width: 20px;
      height: 20px;
      background: #ff8fc2;
      border-radius: 50%;
      box-shadow:
        0 -12px #ff8fc2,
        0 12px #ff8fc2,
        12px 0 #ff8fc2,
        -12px 0 #ff8fc2;
    }

    .flower::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 5px;
      width: 10px;
      height: 10px;
      background: #ffe066;
      border-radius: 50%;
    }

    .flower.f1 { left: 120px; }
    .flower.f2 { left: 220px; bottom: 42px; }
    .flower.f3 { right: 200px; }
    .flower.f4 { right: 120px; bottom: 44px; }

    .sparkle {
      position: absolute;
      color: #fff;
      font-size: 20px;
      text-shadow: 0 0 8px rgba(255,255,255,0.85);
      animation: twinkle 2.6s ease-in-out infinite;
    }

    .sparkle.s1 { top: 85px; left: 90px; }
    .sparkle.s2 { top: 120px; left: 310px; animation-delay: .7s; }
    .sparkle.s3 { top: 90px; right: 310px; animation-delay: 1.1s; }
    .sparkle.s4 { top: 145px; right: 110px; animation-delay: 1.7s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.12); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="title">თამარრ ხომ იციი რო ძალიიან მიყვარხარ</div>

    <div class="moon"></div>

    <div class="sky-heart h1">♥</div>
    <div class="sky-heart h2">♥</div>
    <div class="sky-heart h3">♥</div>
    <div class="sky-heart h4">♥</div>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✦</div>

    <div class="couple">
      <div class="blush-heart">♥</div>

      <div class="person girl">
        <div class="hair-back"></div>
        <div class="hair-shine"></div>
        <div class="head"></div>
        <div class="neck"></div>
        <div class="torso"></div>
        <div class="arm outer"></div>
        <div class="arm inner"></div>
        <div class="skirt"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="shoe left"></div>
        <div class="shoe right"></div>
      </div>

      <div class="joined-hands"></div>

      <div class="person boy">
        <div class="hair"></div>
        <div class="head"></div>
        <div class="neck"></div>
        <div class="torso"></div>
        <div class="arm outer"></div>
        <div class="arm inner"></div>
        <div class="shorts"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="shoe left"></div>
        <div class="shoe right"></div>
      </div>
    </div>

    <div class="flower f1"></div>
    <div class="flower f2"></div>
    <div class="flower f3"></div>
    <div class="flower f4"></div>

    <div class="ground"></div>
  </div>
</body>
</html>
